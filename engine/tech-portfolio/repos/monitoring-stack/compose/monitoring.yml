# Bind published ports to the overlay address of the host, e.g.
#   "OVERLAY_IP:9090:9090"
# so nothing is reachable from LAN/WAN. OVERLAY_IP comes from .env (gitignored).
services:
  prometheus:
    image: prom/prometheus:v2.53.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=30d
    volumes:
      - ../prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prom-data:/prometheus
    ports:
      - "${OVERLAY_IP:?set in .env}:9090:9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.1.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:?set in .env}"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ../grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "${OVERLAY_IP:?set in .env}:3000:3000"
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:v1.8.1
    pid: host
    volumes:
      - /:/host:ro,rslave
    command:
      - --path.rootfs=/host
    network_mode: host
    restart: unless-stopped

  smartctl-exporter:
    image: prometheuscommunity/smartctl-exporter:v0.12.0
    privileged: true
    ports:
      - "${OVERLAY_IP:?set in .env}:9633:9633"
    restart: unless-stopped

volumes:
  prom-data:
  grafana-data:
