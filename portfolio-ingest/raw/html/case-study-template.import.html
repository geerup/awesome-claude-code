/* ============================================================
   APPLE-INSPIRED CASE STUDY TEMPLATE
   Shared layout for all 11 case studies. Content is picked from
   the CASES data object by ?case=slug. WordPress port: each
   entry here maps 1:1 to a custom post type "case_study" —
   the same field names used as ACF keys (title, eyebrow, hero,
   headline, sub, meta[], challenge, what, results[], quote[], takeaway).
============================================================ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #ffffff;
  --bg-alt: #f5f5f7;
  --bg-dark: #000000;
  --bg-dark-2: #1d1d1f;
  --ink: #1d1d1f;
  --ink-2: #424245;
  --ink-mid: #6e6e73;
  --ink-soft: #86868b;
  --rule: #d2d2d7;
  --rule-soft: #e8e8ed;
  --link: #0071e3;
  --link-hover: #0077ed;
  --accent: #ca5c1f;

  --sf: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text",
        "Helvetica Neue", Helvetica, Arial, sans-serif;
  --mono: "SF Mono", ui-monospace, Menlo, Consolas, monospace;
  --max: 1100px;
  --nav-h: 48px;
}

html { scroll-behavior: smooth; }
body {
  font-family: var(--sf);
  background: var(--bg);
  color: var(--ink);
  font-size: 17px; line-height: 1.5;
  letter-spacing: -0.016em;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  overflow-x: hidden;
}
img, svg { display: block; max-width: 100%; }
a { color: var(--link); text-decoration: none; }
a:hover { text-decoration: underline; }
::selection { background: rgba(0,113,227,.2); }

/* ============================================================
   NAV
============================================================ */
.apnav {
  position: fixed; top: 0; left: 0; right: 0; z-index: 9999;
  height: var(--nav-h);
  background: rgba(255,255,255,.72);
  backdrop-filter: saturate(180%) blur(20px);
  -webkit-backdrop-filter: saturate(180%) blur(20px);
  border-bottom: 1px solid rgba(0,0,0,.06);
  display: flex; justify-content: center;
}
.apnav-inner {
  max-width: 1024px; width: 100%;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 22px; height: 100%;
}
.apnav-logo { font-size: 21px; font-weight: 500; letter-spacing: -0.02em; color: var(--ink); }
.apnav-logo .dot { color: var(--link); }
.apnav ul { display: flex; gap: 28px; list-style: none; }
.apnav ul a { font-size: 12px; color: var(--ink); opacity: .88; }
.apnav ul a:hover { opacity: 1; text-decoration: none; }
.apnav-cta { font-size: 12px; color: var(--link); }
@media (max-width: 760px) { .apnav ul { display: none; } }

/* ============================================================
   WRAPPERS + TYPE
============================================================ */
.wrap { max-width: var(--max); margin: 0 auto; padding: 0 22px; }
.wrap-wide { max-width: 1240px; margin: 0 auto; padding: 0 22px; }

.eyebrow {
  font-size: 14px; font-weight: 600;
  color: var(--accent); letter-spacing: 0;
  margin-bottom: 10px;
}
.eyebrow.on-dark { color: #ff7a45; }
.eyebrow.quiet { color: var(--ink-mid); }

.display {
  font-weight: 600; letter-spacing: -0.04em; line-height: 1.05;
  color: var(--ink); text-wrap: balance;
}
.display.xxl { font-size: clamp(48px, 7vw, 88px); letter-spacing: -0.045em; }
.display.xl  { font-size: clamp(40px, 5.4vw, 72px); }
.display.lg  { font-size: clamp(32px, 3.8vw, 52px); }
.display.md  { font-size: clamp(24px, 2.4vw, 36px); letter-spacing: -0.028em; }
.display.sm  { font-size: 22px; letter-spacing: -0.022em; font-weight: 600; }

.sub {
  font-size: clamp(19px, 1.5vw, 24px);
  color: var(--ink-2); line-height: 1.38;
  letter-spacing: -0.02em; text-wrap: pretty;
  max-width: 820px;
}

.back-link {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 14px; color: var(--link);
  margin-bottom: 36px;
}
.back-link::before { content: "‹"; font-size: 18px; line-height: 1; }

/* ============================================================
   HEADER — big editorial opener
============================================================ */
.case-head {
  padding: calc(var(--nav-h) + 72px) 0 32px;
  background: var(--bg);
}
.case-head .meta-row {
  display: flex; gap: 20px; flex-wrap: wrap;
  font-family: var(--mono); font-size: 11.5px;
  letter-spacing: 0.06em; text-transform: uppercase;
  color: var(--ink-soft);
  padding-bottom: 22px; margin-bottom: 34px;
  border-bottom: 1px solid var(--rule-soft);
}
.case-head .meta-row strong { color: var(--ink); font-weight: 600; }
.case-head h1 { max-width: 18ch; margin-bottom: 22px; }
.case-head .lede {
  font-size: clamp(20px, 1.8vw, 28px);
  color: var(--ink-2); line-height: 1.35;
  letter-spacing: -0.022em; max-width: 780px;
  margin-top: 20px; text-wrap: pretty;
}

/* ============================================================
   HERO IMAGE + PLACEHOLDERS
============================================================ */
.hero-img { margin: 56px 0; }
.ph {
  position: relative;
  background: repeating-linear-gradient(135deg,
    #e8e8ed 0 14px, #dcdce0 14px 28px);
  border-radius: 22px; overflow: hidden;
  display: flex; align-items: center; justify-content: center;
  color: var(--ink-mid);
  font-family: var(--mono); font-size: 12px;
  letter-spacing: 0.08em; text-transform: uppercase;
}
.ph .ph-label {
  background: rgba(255,255,255,.86); padding: 8px 14px;
  border-radius: 999px; border: 1px solid rgba(0,0,0,.06);
}
.ph.dark { background: repeating-linear-gradient(135deg,
  #1d1d1f 0 14px, #2a2a2d 14px 28px); color: #86868b; }
.ph.dark .ph-label { background: rgba(0,0,0,.5); color: #a1a1a6;
  border-color: rgba(255,255,255,.1); }
.ph.ratio-21 { aspect-ratio: 21/9; }
.ph.ratio-16 { aspect-ratio: 16/9; }
.ph.ratio-4  { aspect-ratio: 4/3; }
.ph.ratio-1  { aspect-ratio: 1/1; }

/* ============================================================
   KEY NUMBERS — dark slab
============================================================ */
.numbers {
  background: var(--bg-dark); color: #f5f5f7;
  padding: 96px 0;
}
.numbers .grid {
  display: grid; grid-template-columns: repeat(4, 1fr);
  gap: 1px; border: 1px solid rgba(255,255,255,.08);
  background: rgba(255,255,255,.08); border-radius: 16px;
  overflow: hidden; margin-top: 42px;
}
.numbers .cell { background: var(--bg-dark); padding: 36px 24px; text-align: center; }
.numbers .big {
  font-size: clamp(44px, 4.8vw, 68px);
  font-weight: 600; letter-spacing: -0.038em;
  color: #f5f5f7; line-height: 1; margin-bottom: 10px;
  font-variant-numeric: tabular-nums;
}
.numbers .big em { font-style: normal; color: #ff7a45; }
.numbers .lbl { font-size: 13px; color: #a1a1a6; line-height: 1.4; letter-spacing: -0.005em; }
.numbers h2 { color: #f5f5f7; margin: 0 auto 12px; text-align: center; max-width: 16ch; }
.numbers .sub { color: #a1a1a6; margin: 0 auto; text-align: center; }
@media (max-width: 860px) { .numbers .grid { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 480px) { .numbers .grid { grid-template-columns: 1fr; } }

/* ============================================================
   BODY SECTIONS (challenge / what I did / takeaway)
============================================================ */
.body-sec { padding: 100px 0; border-top: 1px solid var(--rule-soft); }
.body-sec:first-of-type { border-top: 0; }
.body-sec .two {
  display: grid; grid-template-columns: 280px 1fr;
  gap: 64px; align-items: start;
}
.body-sec .two .label {
  font-family: var(--mono); font-size: 12px;
  letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--ink-mid); padding-top: 10px;
}
.body-sec h2 { margin-bottom: 22px; max-width: 18ch; }
.body-sec p {
  font-size: 19px; color: var(--ink-2);
  line-height: 1.55; letter-spacing: -0.012em;
  margin-bottom: 18px; max-width: 700px;
  text-wrap: pretty;
}
.body-sec p strong { color: var(--ink); font-weight: 600; }
.body-sec p:last-child { margin-bottom: 0; }
@media (max-width: 860px) {
  .body-sec .two { grid-template-columns: 1fr; gap: 16px; }
}

/* Results table */
.body-sec table {
  width: 100%; max-width: 720px;
  border-collapse: collapse;
  font-size: 15.5px; margin-top: 8px;
}
.body-sec table td {
  padding: 14px 0; border-bottom: 1px solid var(--rule-soft);
  color: var(--ink-2); vertical-align: top;
}
.body-sec table td:first-child { color: var(--ink-mid); width: 45%; padding-right: 24px; }
.body-sec table td:last-child { color: var(--ink); font-weight: 500; }
.body-sec table tr:first-child td { border-top: 1px solid var(--ink); padding-top: 20px; }

/* ============================================================
   PULL QUOTE
============================================================ */
.case-quote {
  background: var(--bg-alt);
  padding: 120px 22px;
  text-align: center;
}
.case-quote blockquote {
  font-size: clamp(28px, 3.2vw, 48px);
  font-weight: 500; letter-spacing: -0.032em;
  line-height: 1.15; color: var(--ink);
  max-width: 900px; margin: 0 auto;
  text-wrap: balance;
}
.case-quote blockquote em { color: var(--accent); font-style: italic; }

/* ============================================================
   NEXT CASE
============================================================ */
.next-case {
  padding: 120px 0; background: var(--bg-dark);
  color: #f5f5f7;
}
.next-case .eyebrow { color: #a1a1a6; }
.next-case h2 { color: #f5f5f7; margin-bottom: 14px; max-width: 16ch; }
.next-case p { color: #a1a1a6; font-size: 18px; margin-bottom: 26px; max-width: 560px; }
.next-case .row { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; margin-top: 44px; }
.next-case a {
  background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.1);
  padding: 32px 28px; border-radius: 18px;
  display: flex; flex-direction: column; gap: 6px;
  color: #f5f5f7; transition: background .2s;
}
.next-case a:hover { background: rgba(255,255,255,.1); text-decoration: none; }
.next-case a .k { font-family: var(--mono); font-size: 11px;
  color: #ff7a45; letter-spacing: 0.06em; text-transform: uppercase; }
.next-case a .t { font-size: 22px; font-weight: 600; letter-spacing: -0.022em; }
.next-case a .s { font-size: 13px; color: #a1a1a6; }
.next-case a::after { content: "›"; font-size: 22px; color: #86868b; margin-top: 8px; }
@media (max-width: 760px) { .next-case .row { grid-template-columns: 1fr; } }

/* ============================================================
   FOOTER
============================================================ */
.apft {
  background: var(--bg-alt); border-top: 1px solid var(--rule-soft);
  padding: 36px 22px; font-size: 12px; color: var(--ink-soft);
  text-align: center;
}
.apft a { color: var(--ink-mid); }

.fade { opacity: 0; transform: translateY(12px); transition: opacity .7s ease, transform .7s ease; }
.fade.in { opacity: 1; transform: translateY(0); }

/* 404-ish state */
.notfound { padding: calc(var(--nav-h) + 120px) 22px 120px; text-align: center; }
.notfound h1 { margin-bottom: 16px; }
.notfound p { color: var(--ink-mid); font-size: 18px; margin-bottom: 28px; }
</style>
</head>

            ${c.challenge.map(p => `<p>${p}</p>`).join('')}
          </div>
        </div>
      </div>
    </section>

    <section class="body-sec">
      <div class="wrap">
        <div class="two">
          <div class="label">What I did</div>
          <div>
            <h2 class="display lg">The work.</h2>
            ${c.what.map(p => `<p>${p}</p>`).join('')}
          </div>
        </div>
      </div>
    </section>

    <section class="body-sec">
      <div class="wrap">
        <div class="two">
          <div class="label">Results</div>
          <div>
            <h2 class="display lg">What shipped.</h2>
            <table>
              <tbody>
                ${c.results.map(r => `<tr><td>${esc(r[0])}</td><td>${esc(r[1])}</td></tr>`).join('')}
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </section>

    <section class="case-quote">
      <blockquote>"${c.quote}"</blockquote>
    </section>

    <section class="next-case">
      <div class="wrap">
        <p class="eyebrow">Keep reading</p>
        <h2 class="display xl">More case studies.</h2>
        <p>Each one is a different category, a different problem. The engine underneath is recognisably the same.</p>
        <div class="row">
          <a href="?case=${prevSlug}">
            <span class="k">Previous</span>
            <span class="t">${esc(LABEL[prevSlug])}</span>
            <span class="s">${esc(CASES[prevSlug].title)}</span>
          </a>
          <a href="?case=${nextSlug}">
            <span class="k">Next</span>
            <span class="t">${esc(LABEL[nextSlug])}</span>
            <span class="s">${esc(CASES[nextSlug].title)}</span>
          </a>
        </div>
      </div>
    </section>
  `;

  /* reveal */
  const io = new IntersectionObserver(es => es.forEach(e => {
    if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); }
  }), {threshold:0.1, rootMargin:'0px 0px -40px 0px'});
  root.querySelectorAll('section').forEach(s => { s.classList.add('fade'); io.observe(s); });

  /* scroll top on nav between cases */
  window.scrollTo(0,0);
}

window.addEventListener('popstate', render);
render();
</script>
</body>
</html>
